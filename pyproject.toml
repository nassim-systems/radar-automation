[project]
name = "radar-automation"
version = "0.1.0"
description = "RSS radar automation tooling"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.120.0",
  "pydantic>=2.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["tests/fixtures", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "T20", "B", "SIM", "PL"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
