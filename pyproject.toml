[project]
name = "radar-automation"
version = "0.1.0"
description = "RSS radar automation tooling"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.120.0",
  "pydantic>=2.0",
]

[project.scripts]
run-radar = "app:run"

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "composition", "settings"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["tests/fixtures", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "T20", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Les scripts opérationnels et le point d'entrée peuvent écrire sur stdout.
"scripts/*" = ["T201"]
"src/app.py" = ["T201"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
