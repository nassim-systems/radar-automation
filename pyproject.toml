[project]
name = "radar-automation"
version = "0.1.0"
description = "Automated RSS monitoring pipeline: LLM relevance scoring and draft generation, with measured and documented design decisions"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.120.0",
  "pydantic>=2.0",
  "certifi>=2024.0.0",
]

[project.scripts]
radar-run = "app:main"

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "composition", "settings"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["tests/fixtures", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "T20", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Operational scripts and the entry point may write to stdout.
"scripts/*" = ["T201"]
"src/app.py" = ["T201"]
# url -> label dictionaries: real URLs cannot be shortened.
"scripts/label_heldout_pool.py" = ["E501"]
"scripts/label_production_recall_check.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
